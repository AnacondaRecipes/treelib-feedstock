{% set name = "treelib" %}
{% set version = "1.8.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/caesar0301/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 5d1519b84178d0def1f3471250a8e9da8fce897fbf33a626a7f5372901a634ce

build:
  number: 0
  skip: true  # [py<37]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - poetry-core
  run:
    - six >=1.13.0
    - python


test:
  source_files:
    - tests
  imports:
    - treelib
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - set PYTHONUTF8=1  # [win]
    - set PYTHONIOENCODING="UTF-8"  # [win]
    - pytest -v tests
  requires:
    - pip
    - pytest

about:
  home: https://github.com/caesar0301/treelib
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Tree implementation in python. Simple for you to use.
  description: |
    Tree is an important data structure in computer science.
    Examples are shown in ML algorithm designs such as random forest
    tree and software engineering such as file system index. treelib is
    created to provide an efficient implementation of tree data structure in Python.
  doc_url: https://treelib.readthedocs.io
  dev_url: https://github.com/caesar0301/treelib

extra:
  recipe-maintainers:
    - shcheklein
    - efiop
    - maxhora
